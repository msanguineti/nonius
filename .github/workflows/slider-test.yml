name: Slider test APK

on:
  push:
    branches: [test/slider-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    if: github.repository == 'msanguineti/nonius'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Unit tests and lint
        run: tools/check.sh --stacktrace

      - name: Build the separately installable test APK
        run: ./gradlew --console=plain assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify and package the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-apk
          cp app/build/outputs/apk/debug/app-debug.apk test-apk/nonius-slider-test.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose test-apk/nonius-slider-test.apk
          "$build_tools/aapt2" dump badging test-apk/nonius-slider-test.apk > test-apk/apk-info.txt
          grep -F "package: name='dev.kaleve.nonius.slidertest'" test-apk/apk-info.txt
          grep -F "application-label:'Nonius Slider Test'" test-apk/apk-info.txt
          git rev-parse HEAD > test-apk/source-commit.txt
          (cd test-apk && sha256sum nonius-slider-test.apk > SHA256SUMS)

      - name: Upload the test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nonius-slider-test
          path: test-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gesture regression tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@ed009f5318f15b1cf93a191b856c4f1748a2d4c1
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --console=plain connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slider-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 14
